name: Build TWRP

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: TWRP manifest branch (older = smaller recovery)
        type: choice
        options:
          - twrp-5.1
          - twrp-6.0
          - twrp-7.1
          - twrp-8.1
          - twrp-9.0
        default: twrp-5.1
        required: true
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  MANIFEST: ${{ github.event.inputs.manifest || 'twrp-6.0' }}
  DEVICE: hl3gds
  DEVICE_PATH: device/samsung/hl3gds
  WORKDIR: /tmp/twrp

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4

      - name: Verify prebuilt binaries
        run: |
          cd "$GITHUB_WORKSPACE/prebuilt"
          echo "f3fb077167b04df282043b4530557251  zImage" | md5sum -c -
          echo "79f9410b09c868d1eff7f6eb5ffcf8a8  dtb" | md5sum -c -

      - name: Show prebuilt sizes
        run: |
          ls -l "$GITHUB_WORKSPACE/prebuilt/"
          echo "Recovery partition limit: 10485760 bytes"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift /opt/az /usr/lib/google-cloud-sdk \
            /usr/local/share/powershell
          sudo apt-get clean
          df -h

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-10-multilib g++-multilib \
            gcc-10-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libstdc++-10-dev \
            libtinfo5 libxml2 libxml2-utils lzop pngcrush python-is-python3 \
            rsync schedtool squashfs-tools unzip xz-utils zip zlib1g-dev
          df -h

      # All offered branches (5.1 - 9.0) are Android 5-9 based: JDK 8 + Python 2
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install Python 2
        run: |
          sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP source
        run: |
          set -euo pipefail
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b "$MANIFEST"
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags
          df -h

      - name: Install device tree
        run: |
          mkdir -p "$WORKDIR/device/samsung"
          rsync -a --exclude='.git' --exclude='.github' --exclude='artifacts' \
            "$GITHUB_WORKSPACE/" "$WORKDIR/$DEVICE_PATH/"
          # Build with a relaxed limit (32 MB) in the build copy only.
          # The real 10 MB limit is enforced after the LZMA repack step.
          grep -rlE '^BOARD_RECOVERYIMAGE_PARTITION_SIZE' "$WORKDIR/$DEVICE_PATH" --include='*.mk' \
            | xargs -r sed -i -E 's/^(BOARD_RECOVERYIMAGE_PARTITION_SIZE[[:space:]]*:?=[[:space:]]*).*/\1 33554432/'
          grep -rn 'BOARD_RECOVERYIMAGE_PARTITION_SIZE' "$WORKDIR/$DEVICE_PATH" --include='*.mk' || true

      - name: Trim extra languages (size)
        run: |
          cd "$WORKDIR"
          find . -path './out' -prune -o -type d -name languages -print
          find bootable -path '*/languages/*.xml' ! -name 'en.xml' -print -delete | wc -l
          find bootable -path '*/languages/*.xml' -print

      - name: Build recovery
        run: |
          set -eo pipefail
          cd "$WORKDIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch omni_hl3gds-eng
          mka recoveryimage

      - name: Repack ramdisk with LZMA
        run: |
          set -euo pipefail
          image="$WORKDIR/out/target/product/hl3gds/recovery.img"
          cp "$image" "$image.orig"
          python3 - "$image" <<'PYEOF'
          import gzip, hashlib, struct, subprocess, sys

          path = sys.argv[1]
          d = open(path, 'rb').read()
          assert d[:8] == b'ANDROID!', 'not an Android boot image'
          (ksize, kaddr, rsize, raddr, ssize, saddr,
           taddr, page, dtsize, osver) = struct.unpack('<10I', d[8:48])
          name, cmdline, extra = d[48:64], d[64:576], d[608:1632]

          def pg(n):
              return (n + page - 1) // page * page

          ko = page
          ro = ko + pg(ksize)
          so = ro + pg(rsize)
          do = so + pg(ssize)
          kernel = d[ko:ko + ksize]
          ramdisk = d[ro:ro + rsize]
          second = d[so:so + ssize]
          dt = d[do:do + dtsize]

          print('original ramdisk: %d bytes, magic %s' % (rsize, ramdisk[:4].hex()))
          if ramdisk[:2] == b'\x1f\x8b':
              raw = gzip.decompress(ramdisk)
              new = subprocess.run(['xz', '--format=lzma', '-9e', '-c'],
                                   input=raw, stdout=subprocess.PIPE,
                                   check=True).stdout
              print('gzip -> lzma: %d -> %d bytes' % (len(ramdisk), len(new)))
              if len(new) < len(ramdisk):
                  ramdisk = new
          else:
              print('ramdisk is not gzip, leaving it as is')

          sha = hashlib.sha1()
          sha.update(kernel); sha.update(struct.pack('<I', ksize))
          sha.update(ramdisk); sha.update(struct.pack('<I', len(ramdisk)))
          sha.update(second); sha.update(struct.pack('<I', ssize))
          if dtsize:
              sha.update(dt); sha.update(struct.pack('<I', dtsize))
          ident = sha.digest().ljust(32, b'\0')

          hdr = struct.pack('<8s10I', b'ANDROID!', ksize, kaddr, len(ramdisk),
                            raddr, ssize, saddr, taddr, page, dtsize, osver)
          hdr += name + cmdline + ident + extra

          def padded(b):
              return b + b'\0' * (pg(len(b)) - len(b))

          out = padded(hdr) + padded(kernel) + padded(ramdisk) + padded(second) + padded(dt)
          open(path, 'wb').write(out)
          print('new image: %d bytes' % len(out))
          PYEOF
          ls -l "$image" "$image.orig"

      - name: Show recovery size breakdown
        if: always()
        run: |
          product="$WORKDIR/out/target/product/hl3gds"
          ls -lh "$product/recovery.img" "$product/ramdisk-recovery.img" "$product/kernel" 2>/dev/null || true
          du -sh "$product/recovery/root" "$product/system" 2>/dev/null || true
          du -ah "$product/recovery/root" 2>/dev/null | sort -h | tail -n 60 || true

      - name: Patch Samsung DTB size
        run: |
          set -euo pipefail
          image="$WORKDIR/out/target/product/hl3gds/recovery.img"
          python3 "$WORKDIR/$DEVICE_PATH/tools/patch_samsung_dt_size.py" \
            "$image" "$WORKDIR/$DEVICE_PATH/prebuilt/dtb"

      - name: Append Samsung trailer
        run: |
          set -euo pipefail
          image="$WORKDIR/out/target/product/hl3gds/recovery.img"
          test -f "$image"
          sh "$WORKDIR/$DEVICE_PATH/tools/append_samsung_trailer.sh" "$image"
          tail -c 272 "$image" | grep -aq 'SEANDROIDENFORCE'
          stat -c '%n %s bytes' "$image"

      - name: Check image fits real partition
        run: |
          set -euo pipefail
          image="$WORKDIR/out/target/product/hl3gds/recovery.img"
          size=$(stat -c %s "$image")
          limit=10485760
          echo "recovery.img = $size bytes, partition = $limit bytes"
          if [ "$size" -gt "$limit" ]; then
            echo "ERROR: image is $((size - limit)) bytes too big for the partition"
            exit 1
          fi

      - name: Package recovery
        run: |
          set -euo pipefail
          product="$WORKDIR/out/target/product/hl3gds"
          cd "$product"
          name="TWRP_hl3gds_${MANIFEST}"
          cp recovery.img "${name}.img"
          tar -H ustar -cf "${name}.tar" recovery.img
          md5sum recovery.img > "${name}.img.md5"
          sha256sum recovery.img > "${name}.img.sha256"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "${name}.img" "${name}.tar" "${name}.img.md5" \
            "${name}.img.sha256" "$GITHUB_WORKSPACE/artifacts/"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-hl3gds-${{ env.MANIFEST }}
          path: ${{ github.workspace }}/artifacts/*
          if-no-files-found: error
          retention-days: 14
